name: ci

# Pull requests and pushes to main. Never touches a cloud account: it proves the site is correct
# before anything ships. Publishing lives in deploy.yml.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch or pull request supersedes the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: reading the checkout is all CI needs.
permissions:
  contents: read

jobs:
  quality:
    name: quality (types, lint, unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: tokens are in sync
        run: npm run tokens:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: unused code and dependencies
        run: npm run knip
      - name: unit tests + coverage
        run: npm run test:coverage
      - name: build script tests
        run: npm run test:scripts

  e2e:
    name: build + e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: build
        run: npm run build
        env:
          # Shown in the footer next to the version, so a deployed build can be identified.
          VITE_APP_COMMIT: ${{ github.sha }}
      - name: install browser
        run: npx playwright install --with-deps chromium
      # Runs against build/ from the step above, served like the host serves it.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 5
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: build/client
          retention-days: 5
          if-no-files-found: error

  storybook:
    name: storybook build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build-storybook -- --quiet

  # Single required status check with a stable name. Branch protection points here, so adding or
  # renaming jobs above never breaks the protection rule.
  ci-result:
    name: ci result
    needs: [quality, e2e, storybook]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: check outcome
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then exit 1; fi
          done
